<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360">
  <title>Façade de musée sous un ciel partiellement nuageux</title>
  <g transform="translate(24,-14)">
  <!-- Soleil -->
  <circle cx="360" cy="92" r="46" fill="#E69F00"/>
  <g stroke="#E69F00" stroke-width="6" stroke-linecap="round">
    <line x1="360" y1="20" x2="360" y2="34"/>
    <line x1="420" y1="44" x2="410" y2="54"/>
    <line x1="432" y1="92" x2="418" y2="92"/>
    <line x1="300" y1="44" x2="310" y2="54"/>
  </g>
  <!-- Nuage -->
  <g fill="#D4D4D4">
    <circle cx="330" cy="128" r="30"/>
    <circle cx="368" cy="116" r="38"/>
    <circle cx="408" cy="132" r="26"/>
    <rect x="300" y="128" width="134" height="30" rx="15"/>
  </g>
  </g>
  <!-- Fronton -->
  <polygon points="70,170 240,100 410,170" fill="#2A3F5E" stroke="#56B4E9" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="240" cy="146" r="12" fill="none" stroke="#56B4E9" stroke-width="4"/>
  <!-- Entablement -->
  <rect x="80" y="170" width="320" height="20" fill="#56B4E9"/>
  <!-- Colonnes -->
  <g fill="#1B3150" stroke="#56B4E9" stroke-width="4">
    <rect x="104" y="198" width="30" height="102"/>
    <rect x="174" y="198" width="30" height="102"/>
    <rect x="276" y="198" width="30" height="102"/>
    <rect x="346" y="198" width="30" height="102"/>
  </g>
  <!-- Porte -->
  <path d="M222 300 V246 a18 18 0 0 1 36 0 V300 Z" fill="#E69F00"/>
  <!-- Marches -->
  <rect x="70" y="300" width="340" height="14" fill="#56B4E9"/>
  <rect x="50" y="314" width="380" height="14" fill="#2A3F5E" stroke="#56B4E9" stroke-width="3"/>
</svg>
